[theme]
title = plonetheme.kaerumy
description = A Diazo based Plone 6 theme (Clean Blog by Start Bootstrap)
doctype = <!DOCTYPE html>
rules = /++theme++plonetheme-kaerumy/rules.xml
prefix = /++theme++plonetheme-kaerumy
preview = preview.png
enabled-bundles = kaerumy-core

production-css = ++theme++plonetheme-kaerumy/css/main.css
development-css = ++theme++plonetheme-kaerumy/css/main.css
tinymce-content-css = ++theme++plonetheme-kaerumy/css/main.css

[theme:parameters]
portal_url = python: portal.absolute_url()
ajax_load = python: request.get('ajax_load')
site_title = python: portal_state.portal_title()
